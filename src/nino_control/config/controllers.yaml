controller_manager:
  ros__parameters:
    # Match the training world's 2 ms physics step.
    update_rate: 500
    use_sim_time: true
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_effort_controller:
      type: effort_controllers/JointGroupEffortController

wheel_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

joint_state_broadcaster:
  ros__parameters:
    # Supply fresh velocity feedback to the 500 Hz effort loop, including
    # while a wheel is briefly unloaded as it crosses a cable.
    update_rate: 500
